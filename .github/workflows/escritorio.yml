# Compila los instaladores de escritorio en ordenadores de GitHub.
#   Windows → instalador .exe (Windows 10 y 11, 64 bits). Activo (D-034).
#   macOS   → .dmg universal. En pausa: se reactiva añadiendo su entrada a la matriz.
# Compilación de prueba: entorno LOCAL, datos en local.db. Cada push publica el zip en
# la descarga fija «prueba-windows» (pestaña Releases). Las versiones para el taller
# (TALLER, etiqueta vX.Y.Z) llegan con el actualizador, en el paso 10 de la Fase 4.
name: Instaladores de escritorio

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/escritorio.yml"

permissions:
  contents: write

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sistema: windows
            rust_targets: x86_64-pc-windows-msvc
            build_args: --bundles nsis
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar Rust
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.sistema }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.sistema }}-

      - run: pnpm install --frozen-lockfile

      - name: Pruebas de Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace --locked

      - name: Compilar el instalador
        working-directory: apps/desktop
        env:
          VITE_ENV: LOCAL
          VITE_VERSION: ${{ github.sha }}
        run: pnpm tauri build ${{ matrix.build_args }}

      - name: Preparar la descarga
        env:
          BUNDLE: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gonzalvo"
          mkdir -p "$out"
          if [ "${{ matrix.sistema }}" = "macos" ]; then
            cp "$BUNDLE"/dmg/*.dmg "$out/"
            ditto -c -k --keepParent "$BUNDLE/macos/Gonzalvo.app" "$out/Gonzalvo.app.zip"
          else
            cp "$BUNDLE"/nsis/*.exe "$out/"
            (cd "$out" && 7z a -tzip -bso0 Gonzalvo-prueba-windows.zip ./*.exe)
          fi
          ls -la "$out"
          echo "### Instalador de prueba para ${{ matrix.sistema }}: descárgalo en «Artifacts», al final de esta página." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Gonzalvo-prueba-${{ matrix.sistema }}-${{ github.sha }}
          path: ${{ runner.temp }}/gonzalvo/
          retention-days: 30

      - name: Publicar la descarga directa
        if: matrix.sistema == 'windows' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=prueba-windows
          notes="Instalador de PRUEBA para Windows 10 y 11 (64 bits). Datos ficticios (entorno LOCAL).
          Compilado desde \`$GITHUB_REF_NAME\` @ ${GITHUB_SHA::7} el $(date -u +%d/%m/%Y\ %H:%M) UTC.
          No es la versión del taller."
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Gonzalvo · prueba para Windows" --notes "$notes"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/gonzalvo/Gonzalvo-prueba-windows.zip" --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Gonzalvo-prueba-windows.zip"
          echo "### Descarga directa: $url" >> "$GITHUB_STEP_SUMMARY"
