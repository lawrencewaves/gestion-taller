# Compila los instaladores de escritorio en ordenadores de GitHub:
#   macOS   → .dmg universal (Intel y Apple Silicon)
#   Windows → instalador .exe (Windows 10 y 11, 64 bits)
# Compilación de prueba: entorno LOCAL, datos en local.db. Se descarga desde la pestaña
# Actions → la ejecución → «Artifacts». Las versiones para el taller (TALLER, etiqueta
# vX.Y.Z) llegan con el actualizador, en el paso 10 de la Fase 4.
name: Instaladores de escritorio

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/escritorio.yml"

permissions:
  contents: read

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            sistema: macos
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            build_args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            sistema: windows
            rust_targets: x86_64-pc-windows-msvc
            build_args: --bundles nsis
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar Rust
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.sistema }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.sistema }}-

      - run: pnpm install --frozen-lockfile

      - name: Pruebas de Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace --locked

      - name: Compilar el instalador
        working-directory: apps/desktop
        env:
          VITE_ENV: LOCAL
          VITE_VERSION: ${{ github.sha }}
        run: pnpm tauri build ${{ matrix.build_args }}

      - name: Preparar la descarga
        env:
          BUNDLE: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gonzalvo"
          mkdir -p "$out"
          if [ "${{ matrix.sistema }}" = "macos" ]; then
            cp "$BUNDLE"/dmg/*.dmg "$out/"
            ditto -c -k --keepParent "$BUNDLE/macos/Gonzalvo.app" "$out/Gonzalvo.app.zip"
          else
            cp "$BUNDLE"/nsis/*.exe "$out/"
          fi
          ls -la "$out"
          echo "### Instalador de prueba para ${{ matrix.sistema }}: descárgalo en «Artifacts», al final de esta página." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Gonzalvo-prueba-${{ matrix.sistema }}-${{ github.sha }}
          path: ${{ runner.temp }}/gonzalvo/
          retention-days: 30
