# Compila el instalador de macOS (universal: Intel y Apple Silicon) en un Mac de GitHub.
# Compilación de prueba: entorno LOCAL, datos en local.db. Se descarga desde la pestaña
# Actions → la ejecución → «Artifacts». Las versiones para el taller (TALLER, etiqueta
# vX.Y.Z) llegan con el actualizador, en el paso 10 de la Fase 4.
name: Instalador de escritorio

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/escritorio.yml"

permissions:
  contents: read

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar Rust para Intel y Apple Silicon
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-macos-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - run: pnpm install --frozen-lockfile

      - name: Pruebas de Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace --locked

      - name: Compilar el instalador
        working-directory: apps/desktop
        env:
          VITE_ENV: LOCAL
          VITE_VERSION: ${{ github.sha }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Preparar la descarga
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gonzalvo"
          mkdir -p "$out"
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/*.dmg "$out/"
          ditto -c -k --keepParent "$bundle/macos/Gonzalvo.app" "$out/Gonzalvo.app.zip"
          ls -la "$out"
          echo "### Instalador de prueba listo: descárgalo en «Artifacts», al final de esta página." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Gonzalvo-prueba-macos-${{ github.sha }}
          path: ${{ runner.temp }}/gonzalvo/
          retention-days: 30
