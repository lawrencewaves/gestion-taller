# Borra la PREVIEW de una rama feature/* cuando se elimina la rama.
name: Limpiar PREVIEW

on: delete

permissions:
  contents: write

jobs:
  limpiar:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feature/')
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Borrar la carpeta de la rama
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "${BRANCH#feature/}" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          if [ ! -d "preview/$slug" ]; then echo "No hay PREVIEW de $BRANCH"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "preview/$slug"
          git commit -m "Borrar PREVIEW de $BRANCH"
          git push origin gh-pages
