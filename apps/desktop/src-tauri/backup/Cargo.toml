[package]
name = "gonzalvo-backup"
version = "0.1.0"
edition = "2021"
description = "Cifrado y escritura segura de las copias de seguridad de Gonzalvo (D-013, D-038)"
publish = false

[dependencies]
# Misma versión que gonzalvo-password: una sola copia de Argon2 en el programa.
argon2 = { version = "=0.5.3", features = ["std"] }
chacha20poly1305 = { version = "=0.10.1", features = ["std", "stream"] }
sha2 = "=0.10.9"
